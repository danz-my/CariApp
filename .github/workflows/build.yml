name: 🚀 Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versi APK (contoh: 1.0, 1.1, 2.0)'
        required: false
        default: '1.0'
      version_code:
        description: 'Kode versi (angka bulat, selalu naik)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🔧 Install Gradle & Regenerate Wrapper
        run: |
          # Install Gradle 8.7
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          export PATH="/opt/gradle-8.7/bin:$PATH"
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

          # Regenerate gradle wrapper using real gradle
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          
          echo "Wrapper jar: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"
          chmod +x gradlew

      - name: 🎨 Download Icon
        run: |
          sudo apt-get install -y imagemagick -q
          curl -L "https://raw.githubusercontent.com/danz-my/jemfut_image/main/cariapp.png" \
            -A "Mozilla/5.0" -o /tmp/icon.png --retry 3 || true
          if [ -f /tmp/icon.png ] && [ $(wc -c < /tmp/icon.png) -gt 1000 ]; then
            convert /tmp/icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert /tmp/icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert /tmp/icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Icon applied"
          fi

      - name: 📝 Set Version
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.version_name }}"/' app/build.gradle

      - name: 🔨 Build APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 📛 Rename APK
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -1 | grep -o '"[^"]*"' | tr -d '"')
          DATE=$(date +%Y%m%d)
          find app/build/outputs/apk -name "*.apk" | while read f; do
            DIR=$(dirname "$f")
            TYPE=$(echo "$f" | grep -o "debug\|release")
            mv "$f" "$DIR/CariApp-v${VERSION}-${TYPE}-${DATE}.apk" 2>/dev/null || true
          done
          find app/build/outputs/apk -name "*.apk"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CariApp-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CariApp-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
